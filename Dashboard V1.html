<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vintage Dashboard</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#0b0b0b;
    font-family: Georgia, serif;
}

.dashboard{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    width:100%;
    height:100%;
}

.clock-container{
    position:relative;
    width:520px;
    height:520px;
}

.clock{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:
        radial-gradient(circle at center,
        #191919 0%,
        #111 65%,
        #080808 100%);
    border:10px solid #c8c8c8;
    box-shadow:
        0 0 30px rgba(255,180,50,.15),
        inset 0 0 30px rgba(255,255,255,.05);
}

.clock::before{
    content:"SMITHS";
    position:absolute;
    top:105px;
    left:50%;
    transform:translateX(-50%);
    color:#d8cfb5;
    font-size:20px;
    letter-spacing:4px;
}

.number{
    position:absolute;
    color:#e2d7b8;
    font-size:34px;
    font-weight:bold;
    text-shadow:0 0 8px rgba(255,220,150,.15);
}

.center{
    position:absolute;
    top:50%;
    left:50%;
    width:18px;
    height:18px;
    transform:translate(-50%,-50%);
    background:#cfcfcf;
    border-radius:50%;
    z-index:20;
}

.hand{
    position:absolute;
    left:50%;
    bottom:50%;
    transform-origin:bottom center;
    border-radius:10px;
}

.hour{
    width:10px;
    height:130px;
    margin-left:-5px;
    background:#e6dbc0;
    z-index:10;
}

.minute{
    width:6px;
    height:185px;
    margin-left:-3px;
    background:#f0ead8;
    z-index:11;
}

.second{
    width:2px;
    height:210px;
    margin-left:-1px;
    background:#b4382e;
    z-index:12;
}

.marker{
    position:absolute;
    left:50%;
    top:10px;
    width:4px;
    height:18px;
    margin-left:-2px;
    background:#d8cfb5;
    transform-origin:50% 250px;
}

.bottom-panel{
    margin-top:25px;
    width:70%;
    display:flex;
    justify-content:space-around;
}

.gauge{
    width:180px;
    height:90px;
    border:3px solid #bdbdbd;
    border-radius:14px;
    background:rgba(20,20,20,.9);
    box-shadow:0 0 15px rgba(255,180,50,.1);
    text-align:center;
}

.gauge-title{
    color:#9e9e9e;
    font-size:14px;
    margin-top:12px;
    letter-spacing:2px;
}

.gauge-value{
    color:#eadfc0;
    font-size:34px;
    margin-top:6px;
}

.date{
    position:absolute;
    top:300px;
    left:50%;
    transform:translateX(-50%);
    color:#d8cfb5;
    font-size:20px;
    letter-spacing:2px;
}
</style>
</head>

<body>

<div class="dashboard">

    <div class="clock-container">
        <div class="clock" id="clock"></div>

        <div class="number" style="top:18px;left:238px;">12</div>
        <div class="number" style="top:84px;right:75px;">1</div>
        <div class="number" style="top:195px;right:22px;">2</div>
        <div class="number" style="bottom:195px;right:22px;">4</div>
        <div class="number" style="bottom:84px;right:75px;">5</div>
        <div class="number" style="bottom:18px;left:245px;">6</div>
        <div class="number" style="bottom:84px;left:75px;">7</div>
        <div class="number" style="bottom:195px;left:22px;">8</div>
        <div class="number" style="top:195px;left:22px;">10</div>
        <div class="number" style="top:84px;left:75px;">11</div>

        <div class="date" id="date"></div>

        <div class="hand hour" id="hour"></div>
        <div class="hand minute" id="minute"></div>
        <div class="hand second" id="second"></div>

        <div class="center"></div>
    </div>

    <div class="bottom-panel">
        <div class="gauge">
            <div class="gauge-title">SPEED</div>
            <div class="gauge-value">---</div>
        </div>

        <div class="gauge">
            <div class="gauge-title">COURSE</div>
            <div class="gauge-value">---</div>
        </div>

        <div class="gauge">
            <div class="gauge-title">ALTITUDE</div>
            <div class="gauge-value">---</div>
        </div>
    </div>

</div>

<script>



const clock = document.getElementById("clock");

for(let i=0;i<60;i++){
    const mark=document.createElement("div");
    mark.className="marker";
    mark.style.transform=`rotate(${i*6}deg)`;
    mark.style.height=(i%5===0)?'28px':'14px';
    clock.appendChild(mark);
}

function updateClock(){

    const now=new Date();

    const sec=now.getSeconds();
    const min=now.getMinutes()+sec/60;
    const hr=(now.getHours()%12)+min/60;

    document.getElementById("second").style.transform=
        `rotate(${sec*6}deg)`;

    document.getElementById("minute").style.transform=
        `rotate(${min*6}deg)`;

    document.getElementById("hour").style.transform=
        `rotate(${hr*30}deg)`;

    const opciones={
      weekday:'long',
      day:'2-digit',
      month:'short'
    };

    document.getElementById("date").textContent=
        now.toLocaleDateString('es-ES',opciones).toUpperCase();
}

setInterval(updateClock,1000);
updateClock();

const gauges = document.querySelectorAll(".gauge-value");

const speedElement = gauges[0];
const courseElement = gauges[1];
const altitudeElement = gauges[2];

// GPS CALCULADO

let lastLat = null;
let lastLon = null;
let lastTime = null;

function degreesToCardinal(deg) {

    if (deg === null || isNaN(deg))
        return "---";

    const dirs = [
        "N","NE","E","SE",
        "S","SW","W","NW"
    ];

    return dirs[
        Math.round(deg / 45) % 8
    ];
}

function distanceMeters(lat1, lon1, lat2, lon2) {

    const R = 6371000;

    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;

    const a =
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon/2) * Math.sin(dLon/2);

    const c = 2 * Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1-a)
    );

    return R * c;
}

function bearing(lat1, lon1, lat2, lon2) {

    const y =
        Math.sin((lon2-lon1) * Math.PI/180) *
        Math.cos(lat2 * Math.PI/180);

    const x =
        Math.cos(lat1 * Math.PI/180) *
        Math.sin(lat2 * Math.PI/180) -
        Math.sin(lat1 * Math.PI/180) *
        Math.cos(lat2 * Math.PI/180) *
        Math.cos((lon2-lon1) * Math.PI/180);

    let brng =
        Math.atan2(y,x) * 180 / Math.PI;

    return (brng + 360) % 360;
}

navigator.geolocation.watchPosition(

    function(pos){

        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        const alt = pos.coords.altitude;

        const now = Date.now();

        if(
            lastLat !== null &&
            lastLon !== null &&
            lastTime !== null
        ){

            const meters =
                distanceMeters(
                    lastLat,
                    lastLon,
                    lat,
                    lon
                );

            const seconds =
                (now - lastTime) / 1000;

            if(seconds > 0){

                const kmh =
                    Math.round(
                        (meters / seconds) * 3.6
                    );

                speedElement.textContent =
                    kmh;
            }

            const deg =
                bearing(
                    lastLat,
                    lastLon,
                    lat,
                    lon
                );

            courseElement.textContent =
                degreesToCardinal(deg);
        }

        if(alt !== null){

            altitudeElement.textContent =
                Math.round(alt);

        } else {

            altitudeElement.textContent =
                "---";
        }

        lastLat = lat;
        lastLon = lon;
        lastTime = now;

    },

    function(err){

        speedElement.textContent = "ERR";
        courseElement.textContent = "ERR";
        altitudeElement.textContent = "ERR";

    },

    {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 10000
    }

);



</script> 
    


</body>
</html>
