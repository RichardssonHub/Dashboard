<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Jaguar Dashboard</title>

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#070707;
    color:#eadfc0;
    font-family:Georgia,serif;
}

body{
    display:flex;
    flex-direction:column;
}

#fullscreenBtn{
    position:absolute;
    top:10px;
    right:10px;
    z-index:100;
    background:#333;
    color:#fff;
    border:none;
    border-radius:8px;
    padding:8px 14px;
}

.main{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.clock-container{

    position:relative;

    width:min(60vh,60vw);
    height:min(60vh,60vw);

    min-width:260px;
    min-height:260px;
}

.clock{

    position:absolute;
    inset:0;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        #1a1a1a 0%,
        #121212 70%,
        #080808 100%
    );

    border:8px solid #bdbdbd;

    box-shadow:
        0 0 20px rgba(255,170,60,.15),
        inset 0 0 20px rgba(255,255,255,.05);
}

.marker{
    position:absolute;
    left:50%;
    top:2%;
    width:3px;
    background:#d8cfb5;
    transform-origin:center 48%;
}

.number{

    position:absolute;

    color:#eadfc0;
    font-weight:bold;

    transform:
      translate(-50%,-50%);

    text-shadow:
      0 0 6px rgba(255,220,120,.2);
}

.brand{

    position:absolute;
    top:24%;
    width:100%;
    text-align:center;

    letter-spacing:4px;
    font-size:2vh;

    color:#d8cfb5;
}

.date{

    position:absolute;
    width:100%;
    text-align:center;

    top:63%;

    font-size:2vh;

    color:#d8cfb5;
}

.hand{
    position:absolute;
    left:50%;
    bottom:50%;
    transform-origin:bottom center;
    border-radius:20px;
}

.hour{
    width:0.9%;
    height:24%;
    background:#eadfc0;
    margin-left:-0.45%;
}

.minute{
    width:0.6%;
    height:34%;
    background:#f4edd7;
    margin-left:-0.3%;
}

.second{
    width:0.25%;
    height:39%;
    background:#b4382e;
    margin-left:-0.125%;
}

.center{
    position:absolute;
    width:16px;
    height:16px;
    background:#ddd;
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

.panel{

    width:90%;

    display:grid;
    grid-template-columns:
        repeat(3,1fr);

    gap:20px;

    margin-top:20px;
    margin-bottom:20px;
}

.gauge{

    border:2px solid #aaa;

    border-radius:12px;

    text-align:center;

    background:
    rgba(20,20,20,.95);

    box-shadow:
      0 0 15px rgba(255,180,50,.06);

    padding:10px;
}

.gauge-title{
    color:#9f9f9f;
    letter-spacing:2px;
    font-size:14px;
}

.gauge-value{
    font-size:40px;
    color:#eadfc0;
}

</style>
</head>
<body>


<div class="main">

<div class="clock-container">

<div class="clock" id="clock"></div>

<div class="brand">
SMITHS
</div>

<div class="date" id="date">
</div>

<div class="hand hour" id="hour"></div>
<div class="hand minute" id="minute"></div>
<div class="hand second" id="second"></div>

<div class="center"></div>

</div>

<div class="panel">

<div class="gauge">
<div class="gauge-title">SPEED</div>
<div class="gauge-value" id="speed">---</div>
</div>

<div class="gauge">
<div class="gauge-title">COURSE</div>
<div class="gauge-value" id="course">---</div>
</div>

<div class="gauge">
<div class="gauge-title">ALTITUDE</div>
<div class="gauge-value" id="altitude">---</div>
</div>

</div>

</div>


    
<script>

const clock=
document.getElementById("clock");

/* marcas */

for(let i=0;i<60;i++){

    const m=
    document.createElement("div");

    m.className="marker";

    m.style.height=
       i%5===0
       ? "4%"
       : "2%";

    m.style.transform=
      `translateX(-50%) rotate(${i*6}deg)`;

    clock.appendChild(m);
}

/* números */

for(let n=1;n<=12;n++){

    const div=
    document.createElement("div");

    div.className="number";

    div.innerHTML=n;

    const angle=
    (n-3)*30*Math.PI/180;

    const r=40;

    div.style.left=
      (50+r*Math.cos(angle))
      +"%";

    div.style.top=
      (50+r*Math.sin(angle))
      +"%";

    clock.appendChild(div);
}

function updateClock(){

    const now=
    new Date();

    const sec=
    now.getSeconds();

    const min=
    now.getMinutes()+sec/60;

    const hour=
    (now.getHours()%12)+min/60;

    hourEl.style.transform=
      `rotate(${hour*30}deg)`;

    minuteEl.style.transform=
      `rotate(${min*6}deg)`;

    secondEl.style.transform=
      `rotate(${sec*6}deg)`;

    dateEl.textContent=
      now.toLocaleDateString(
        'es-ES',
        {
          weekday:'long',
          day:'2-digit',
          month:'short'
        }
      ).toUpperCase();
}

const hourEl=
document.getElementById("hour");

const minuteEl=
document.getElementById("minute");

const secondEl=
document.getElementById("second");

const dateEl=
document.getElementById("date");

setInterval(updateClock,1000);
updateClock();

const speedEl=
document.getElementById("speed");

const courseEl=
document.getElementById("course");

const altitudeEl=
document.getElementById("altitude");

let lastLat=null;
let lastLon=null;
let lastTime=null;
let speedBuffer=[];
    
function bearing(lat1,lon1,lat2,lon2){

 const y=
 Math.sin((lon2-lon1)*Math.PI/180)
 *Math.cos(lat2*Math.PI/180);

 const x=
 Math.cos(lat1*Math.PI/180)
 *Math.sin(lat2*Math.PI/180)
 -
 Math.sin(lat1*Math.PI/180)
 *Math.cos(lat2*Math.PI/180)
 *Math.cos((lon2-lon1)*Math.PI/180);

 return (
  Math.atan2(y,x)
  *180/Math.PI
  +360
 )%360;
}

function cardinal(deg){

 const dirs=
 [
  "N","NE","E","SE",
  "S","SW","W","NW"
 ];

 return dirs[
  Math.round(deg/45)%8
 ];
}

function distanceMeters(
 lat1,lon1,
 lat2,lon2){

 const R=6371000;

 const dLat=
 (lat2-lat1)
 *Math.PI/180;

 const dLon=
 (lon2-lon1)
 *Math.PI/180;

 const a=
 Math.sin(dLat/2)**2+
 Math.cos(lat1*Math.PI/180)*
 Math.cos(lat2*Math.PI/180)*
 Math.sin(dLon/2)**2;

 const c=
 2*Math.atan2(
  Math.sqrt(a),
  Math.sqrt(1-a)
 );

 return R*c;
}

navigator.geolocation.watchPosition(

function(pos){

 const lat=
 pos.coords.latitude;

 const lon=
 pos.coords.longitude;

 const alt=
 pos.coords.altitude;

 const now=
 Date.now();

 if(
  lastLat!==null
 ){

  const dist=
  distanceMeters(
   lastLat,lastLon,
   lat,lon
  );

  const sec=
  (now-lastTime)/1000;

 let kmh =
Math.round(
 (dist/sec)*3.6
);

speedBuffer.push(kmh);

if(speedBuffer.length>5)
    speedBuffer.shift();

kmh =
Math.round(
 speedBuffer.reduce(
   (a,b)=>a+b,0
 ) / speedBuffer.length
);


  speedEl.textContent=
   kmh;

if(kmh > 8){

 courseEl.textContent=
  cardinal(
   bearing(
    lastLat,lastLon,
    lat,lon
   )
  );

}
 }

 altitudeEl.textContent=
 alt!=null
 ? Math.round(alt)
 : "---";

 lastLat=lat;
 lastLon=lon;
 lastTime=now;

},

function(){

 speedEl.textContent="ERR";
 courseEl.textContent="ERR";
 altitudeEl.textContent="ERR";
},

{
 enableHighAccuracy:true,
 maximumAge:0
}

);

let lastTap = 0;

document.addEventListener("touchend", () => {

    const now = Date.now();

    if (now - lastTap < 350) {

        if (!document.fullscreenElement) {

            document.documentElement.requestFullscreen();

        } else {

            document.exitFullscreen?.();

        }
    }

    lastTap = now;

});
    
</script>

</body>
</html>
